name: Keep database awake

# Free Supabase projects pause after 7 days without activity.
# This reads the public summary view once a day so the dashboard stays online.
on:
  schedule:
    - cron: "17 14 * * *"   # every day, about 9:17 AM Eastern
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read ticket_stats
        run: |
          curl -fsS "https://pwcpznbqkdlprkkydpnk.supabase.co/rest/v1/ticket_stats" \
            -H "apikey: sb_publishable_-QgwfTu1udPpjH6ndtqGEA_FUUsMz7G"
